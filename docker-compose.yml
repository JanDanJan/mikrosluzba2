version: "3.9"

networks:
  walrus-net:
    external: true   # created earlier with: docker network create walrus-net

services:
  ms2:
    build: .
    image: ms2:latest
    container_name: ms2
    restart: unless-stopped

    env_file:
      - .env

    # Needed on Linux so the container can reach the host’s 127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - walrus-net
